<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<header>
			<nav>
				<!-- navigation -->
				<a href = "about_us.html">About Us</a> 
				<a href = "services.html">Services</a>
			</nav>
		</header>
	<main>
			<form >
				<div>
					<label for="full_name">Full name</label>
					<input type="text" name="full_name" id="full_name" value="Apsa Biju">
				</div>
				<div>
					<label for="email">Email</label>
					<input type="email" name="Email" id="email" placeholder="Enter your email id">
				</div>
				<div>
					<label for="password">Password</label>
					<input type="password" name="password" id="password" placeholder="Enter your password" required>
				</div>
				<div>
					<label for="DOB">DOB</label>
					<input type="date" name="DOB" id="DOB " placeholder="select your DOB">
				</div>
				<div>
					<label >Gender</label>
					<label >Male</label>
					<input type="radio" name="gender" value="male">
					<label >Female</label>
					<input type="radio" name="gender" value="female">
					<label >Other</label>
					<input type="radio" name="gender" value="other">
				</div>
				<div>
					<label for="age"></label>
					<input type="number" name="age" id="age" min="18" max="60" value="18">
				</div>
				<div>
					<h4>Select your course</h4>
					<input type="checkbox" 
                   name="check" 
                   id="checkbox1" 
                   value="html" checked>
            <label for="checkbox1">HTML</label>
            <br>

            <input type="checkbox" 
                   name="check" 
                   id="checkbox2" 
                   value="css">
            <label for="checkbox2">CSS</label>
            <br>

            <input type="checkbox" 
                   name="check" 
                   id="checkbox3" 
                   value="javascript">
            <label for="checkbox3">JavaScript</label>
				</div>
				<div>
					<input type="submit" name="submit">
				</div>
			</form>
		
	</main>
</body>
</html>
