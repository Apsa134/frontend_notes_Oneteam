<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html{
            scroll-behavior:smooth;
        }
        header{
            top:0;
            left:0;
            width: 100%;
            position: relative;
            background-color: antiquewhite;
            
        }
        nav{
            display: flex;
            justify-content: space-between;
            padding: 15px;
        }

        .logo{
            font-size: 25px;
            font-weight: bold;
        }
        .nav-links{
            display:flex;
            list-style: none;
        }
        .nav-links li{
            margin-left: 30px;
        }
        .nav-links a{
            text-decoration: none;
            font-size: 20px;
        }

        section{
            height: 100vh;
            padding: 100px 8% 100px;
            
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">My Website</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" style="background-color: aquamarine;">
        <h1>Home - Welcome to MyWebsite</h1>
    </section>

    <section id="about" style="background-color: burlywood;">
        <h2>About Us</h2>
    </section>

    <section id="services" style="background-color: chocolate;">
        <h2>Our Services</h2>

    </section>
</body>
</html>
